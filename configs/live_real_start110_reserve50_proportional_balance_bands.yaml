# Proportional real-money balance settings for live_strategy_suite.py.
#
# Wallet assumption:
# - total account balance around 110
# - 50 is treated as untouched reserve
# - 60 is treated as tradable master balance
#
# This version keeps effective market balance roughly in the 20%-40% zone
# once tradable master is healthy, while still letting small balances trade.

starting_balance: 60
initial_reserved_balance: 50
effective_market_balance_cap:

# Reserve 10% of tradable master balance once when each 10x threshold is crossed.
withdrawal_pct: 0.10
withdrawal_thresholds:
  - 100
  - 1000
  - 10000
  - 100000
  - 1000000

# [min_tradable_master_balance, max_tradable_master_balance, effective_market_balance]
effective_market_balance_bands:
  - [1, 16, 5]
  - [16, 31, 10]
  - [31, 75, 15]
  - [75, 150, 30]
  - [150, 300, 60]
  - [300, 600, 120]
  - [600, 1200, 240]
  - [1200, 2400, 480]
  - [2400, 4800, 960]
  - [4800, 9600, 1920]
  - [9600, 19200, 3840]
  - [19200, null, 7680]

effective_market_balance_default: 0
