name: binance_lead_p05_l02_first_s10_hold
type: rule_based
starting_balance: 100
order_usd: 1

# Auto-generated by scripts/simulation/generate_binance_lead_configs.py
# Binance-lead lottery variant 'p05_l02_first_s10_hold': price cap=0.05,
# min binance lead past strike=0.02%, first_touch=True,
# token_amount=25, lottery pool share=0.166667,
# min_seconds_left=10, take_profit=False

params:
  default_usd_amount: 1
  max_orders: 200
  cooldown_ticks: 3

  pools:
    lottery:
      max_pool_spend_pct: 0.166667

  rules:
    - name: binlead_up_lottery
      pool: lottery
      all:
        - metric: up_price
          operator: "<="
          value: 0.05
        - metric: btc_binance_distance_to_price_to_beat_pct
          operator: ">="
          value: 0.02
        - metric: seconds_left
          operator: ">="
          value: 10
        - metric: has_up_position
          operator: "is"
          value: false
      action: buy_up
      token_amount: 25

    - name: binlead_down_lottery
      pool: lottery
      all:
        - metric: down_price
          operator: "<="
          value: 0.05
        - metric: btc_binance_distance_to_price_to_beat_pct
          operator: "<="
          value: -0.02
        - metric: seconds_left
          operator: ">="
          value: 10
        - metric: has_down_position
          operator: "is"
          value: false
      action: buy_down
      token_amount: 25
