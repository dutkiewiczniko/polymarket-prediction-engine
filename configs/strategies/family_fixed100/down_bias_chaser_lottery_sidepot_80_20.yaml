name: family_down_bias_chaser_lottery_sidepot_80_20
type: rule_based
starting_balance: 100
order_usd: 1

params:
  default_usd_amount: 1
  max_orders: 65
  cooldown_ticks: 3

  # Re-tuned split: the first cut (main=70/lottery=30) showed the lottery pool
  # never got exhausted in any of 50 markets (peak single-market usage $25.25,
  # median $3.50), while the main pool was throttled 10,704 times across the
  # same 50 markets. Lottery only needs a modest reserve; main needs almost
  # everything to replicate down_bias_chaser's original (uncapped) behavior.
  pools:
    main:
      max_pool_spend_usd: 80
    lottery:
      max_pool_spend_usd: 20

  rules:
    - name: take_profit_up_position
      all:
        - metric: has_up_position
          operator: "is"
          value: true
        - metric: up_price
          operator: ">="
          value: 0.95
      action: sell_up

    - name: take_profit_down_position
      all:
        - metric: has_down_position
          operator: "is"
          value: true
        - metric: down_price
          operator: ">="
          value: 0.95
      action: sell_down

    - name: cheap_up_lottery
      pool: lottery
      all:
        - metric: up_price
          operator: "<="
          value: 0.025
      action: buy_up
      token_amount: 25

    - name: cheap_down_lottery
      pool: lottery
      all:
        - metric: down_price
          operator: "<="
          value: 0.025
      action: buy_down
      token_amount: 25

    - name: btc_below_price_to_beat_buy_down
      pool: main
      all:
        - metric: btc_below_price_to_beat
          operator: "is"
          value: true
        - metric: down_price
          operator: "<="
          value: 0.85
      action: buy_down
      token_amount: 30

    - name: up_price_momentum_chase_buy_up
      pool: main
      all:
        - metric: up_price_pct_change
          operator: ">="
          value: 3
        - metric: up_price
          operator: "<="
          value: 0.85
      action: buy_up
      token_amount: 20

    - name: down_price_momentum_chase_buy_down
      pool: main
      all:
        - metric: down_price_pct_change
          operator: ">="
          value: 3
        - metric: down_price
          operator: "<="
          value: 0.85
      action: buy_down
      token_amount: 30
