name: family_down_bias_chaser_lottery_sidepot
type: rule_based
starting_balance: 100
order_usd: 1

params:
  default_usd_amount: 1
  max_orders: 65
  cooldown_ticks: 3

  # $30 is permanently reserved for cheap-lottery buys and the down_bias_chaser
  # rules below can never touch it -- they're capped to the remaining $70 via the
  # "main" pool, even though the original down_bias_chaser has no spend cap at all.
  pools:
    main:
      max_pool_spend_usd: 70
    lottery:
      max_pool_spend_usd: 30

  rules:
    - name: take_profit_up_position
      all:
        - metric: has_up_position
          operator: "is"
          value: true
        - metric: up_price
          operator: ">="
          value: 0.95
      action: sell_up

    - name: take_profit_down_position
      all:
        - metric: has_down_position
          operator: "is"
          value: true
        - metric: down_price
          operator: ">="
          value: 0.95
      action: sell_down

    # Cheap-lottery legs, straight from cheap_lottery_only (symmetric 25 tokens,
    # 0.025 threshold), funded exclusively from the "lottery" pool.
    - name: cheap_up_lottery
      pool: lottery
      all:
        - metric: up_price
          operator: "<="
          value: 0.025
      action: buy_up
      token_amount: 25

    - name: cheap_down_lottery
      pool: lottery
      all:
        - metric: down_price
          operator: "<="
          value: 0.025
      action: buy_down
      token_amount: 25

    # down_bias_chaser's directional/momentum rules, unchanged, funded from "main".
    - name: btc_below_price_to_beat_buy_down
      pool: main
      all:
        - metric: btc_below_price_to_beat
          operator: "is"
          value: true
        - metric: down_price
          operator: "<="
          value: 0.85
      action: buy_down
      token_amount: 30

    - name: up_price_momentum_chase_buy_up
      pool: main
      all:
        - metric: up_price_pct_change
          operator: ">="
          value: 3
        - metric: up_price
          operator: "<="
          value: 0.85
      action: buy_up
      token_amount: 20

    - name: down_price_momentum_chase_buy_down
      pool: main
      all:
        - metric: down_price_pct_change
          operator: ">="
          value: 3
        - metric: down_price
          operator: "<="
          value: 0.85
      action: buy_down
      token_amount: 30
