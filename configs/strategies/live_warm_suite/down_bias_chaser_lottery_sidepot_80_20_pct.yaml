name: family_down_bias_chaser_lottery_sidepot_80_20_pct
type: rule_based
starting_balance: 100
order_usd: 1

# Same 80/20 main/lottery split as down_bias_chaser_lottery_sidepot_80_20, but
# using max_pool_spend_pct instead of hardcoded dollar amounts -- scales
# correctly to whatever the effective per-market balance actually is, instead
# of being calibrated to one specific $100 starting balance.
params:
  default_usd_amount: 1
  max_orders: 65
  cooldown_ticks: 3

  pools:
    main:
      max_pool_spend_pct: 0.8
    lottery:
      max_pool_spend_pct: 0.2

  rules:
    - name: take_profit_up_position
      all:
        - metric: has_up_position
          operator: "is"
          value: true
        - metric: up_price
          operator: ">="
          value: 0.95
      action: sell_up

    - name: take_profit_down_position
      all:
        - metric: has_down_position
          operator: "is"
          value: true
        - metric: down_price
          operator: ">="
          value: 0.95
      action: sell_down

    - name: cheap_up_lottery
      pool: lottery
      all:
        - metric: up_price
          operator: "<="
          value: 0.025
      action: buy_up
      token_amount: 25

    - name: cheap_down_lottery
      pool: lottery
      all:
        - metric: down_price
          operator: "<="
          value: 0.025
      action: buy_down
      token_amount: 25

    - name: btc_below_price_to_beat_buy_down
      pool: main
      all:
        - metric: btc_below_price_to_beat
          operator: "is"
          value: true
        - metric: down_price
          operator: "<="
          value: 0.85
      action: buy_down
      token_amount: 30

    - name: up_price_momentum_chase_buy_up
      pool: main
      all:
        - metric: up_price_pct_change
          operator: ">="
          value: 3
        - metric: up_price
          operator: "<="
          value: 0.85
      action: buy_up
      token_amount: 20

    - name: down_price_momentum_chase_buy_down
      pool: main
      all:
        - metric: down_price_pct_change
          operator: ">="
          value: 3
        - metric: down_price
          operator: "<="
          value: 0.85
      action: buy_down
      token_amount: 30
