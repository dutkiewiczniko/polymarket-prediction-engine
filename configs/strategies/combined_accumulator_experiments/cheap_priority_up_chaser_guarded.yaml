name: cheap_priority_up_chaser_guarded
type: rule_based
starting_balance: 100
order_usd: 1

params:
  default_usd_amount: 1
  max_orders: 65
  cooldown_ticks: 4
  max_market_spend_usd: 75

  rules:
    - name: take_profit_up_position
      all:
        - metric: has_up_position
          operator: "is"
          value: true
        - metric: up_price
          operator: ">="
          value: 0.95
      action: sell_up

    - name: take_profit_down_position
      all:
        - metric: has_down_position
          operator: "is"
          value: true
        - metric: down_price
          operator: ">="
          value: 0.95
      action: sell_down

    - name: cheap_up_lottery
      all:
        - metric: up_price
          operator: "<="
          value: 0.025
      action: buy_up
      token_amount: 25

    - name: cheap_down_lottery
      all:
        - metric: down_price
          operator: "<="
          value: 0.025
      action: buy_down
      token_amount: 25

    - name: guarded_btc_above_up_chaser
      all:
        - metric: btc_above_price_to_beat
          operator: "is"
          value: true
        - metric: up_price
          operator: "<="
          value: 0.70
        - metric: up_price
          operator: ">="
          value: 0.05
        - metric: seconds_left
          operator: "<="
          value: 180
      action: buy_up
      token_amount: 20

    - name: guarded_up_momentum_chaser
      all:
        - metric: up_price_pct_change
          operator: ">="
          value: 4
        - metric: up_price
          operator: "<="
          value: 0.70
        - metric: up_price
          operator: ">="
          value: 0.05
        - metric: seconds_left
          operator: "<="
          value: 180
      action: buy_up
      token_amount: 20

