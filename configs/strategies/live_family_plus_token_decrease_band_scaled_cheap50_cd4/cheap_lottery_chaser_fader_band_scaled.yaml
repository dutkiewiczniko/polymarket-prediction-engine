name: family_cheap_lottery_chaser_fader_band_scaled
type: rule_based
starting_balance: 100
order_usd: 1

params:
  default_usd_amount: 1
  max_orders: 80
  cooldown_ticks: 3

  rules:
    - name: take_profit_up_position
      all:
        - metric: has_up_position
          operator: "is"
          value: true
        - metric: up_price
          operator: ">="
          value: 0.95
      action: sell_up

    - name: take_profit_down_position
      all:
        - metric: has_down_position
          operator: "is"
          value: true
        - metric: down_price
          operator: ">="
          value: 0.95
      action: sell_down

    - name: cheap_up_lottery_band_scaled
      all:
        - metric: up_price
          operator: "<="
          value: 0.025
      action: buy_up
      token_amount: 50
      cooldown_ticks: 4

    - name: cheap_down_lottery_band_scaled
      all:
        - metric: down_price
          operator: "<="
          value: 0.025
      action: buy_down
      token_amount: 50
      cooldown_ticks: 4

    - name: btc_above_price_to_beat_chase_up
      all:
        - metric: btc_above_price_to_beat
          operator: "is"
          value: true
        - metric: up_price
          operator: "<="
          value: 0.85
      action: buy_up
      balance_scaled_token_amount: 25

    - name: btc_below_price_to_beat_chase_down
      all:
        - metric: btc_below_price_to_beat
          operator: "is"
          value: true
        - metric: down_price
          operator: "<="
          value: 0.85
      action: buy_down
      balance_scaled_token_amount: 25

    - name: up_price_momentum_chase_buy_up
      all:
        - metric: up_price_pct_change
          operator: ">="
          value: 3
        - metric: up_price
          operator: "<="
          value: 0.85
      action: buy_up
      balance_scaled_token_amount: 20

    - name: down_price_momentum_chase_buy_down
      all:
        - metric: down_price_pct_change
          operator: ">="
          value: 3
        - metric: down_price
          operator: "<="
          value: 0.85
      action: buy_down
      balance_scaled_token_amount: 20

    - name: fade_up_price_spike_buy_down
      all:
        - metric: up_price_pct_change
          operator: ">="
          value: 5
        - metric: up_price
          operator: ">="
          value: 0.6
      action: buy_down
      balance_scaled_token_amount: 20

    - name: fade_down_price_spike_buy_up
      all:
        - metric: down_price_pct_change
          operator: ">="
          value: 5
        - metric: down_price
          operator: ">="
          value: 0.6
      action: buy_up
      balance_scaled_token_amount: 20
