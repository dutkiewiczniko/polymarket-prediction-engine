name: momentum_slow_trend
type: rule_based
starting_balance: 100
order_usd: 1

# Hypothesis: longer-window momentum (60s + 120s agreeing) only fires on an
# established, persistent move rather than a short burst -- fewer signals, but
# each one reflects real accumulated drift rather than a blip. Thresholds
# calibrated near the real p75 for these windows (60s ~0.035%, 120s ~0.037%).

params:
  default_usd_amount: 1
  max_orders: 65
  cooldown_ticks: 3

  rules:
    - name: take_profit_up_position
      all:
        - metric: has_up_position
          operator: "is"
          value: true
        - metric: up_price
          operator: ">="
          value: 0.95
      action: sell_up

    - name: take_profit_down_position
      all:
        - metric: has_down_position
          operator: "is"
          value: true
        - metric: down_price
          operator: ">="
          value: 0.95
      action: sell_down

    - name: cheap_up_lottery
      all:
        - metric: up_price
          operator: "<="
          value: 0.025
      action: buy_up
      token_amount: 25

    - name: cheap_down_lottery
      all:
        - metric: down_price
          operator: "<="
          value: 0.025
      action: buy_down
      token_amount: 25

    - name: slow_momentum_buy_up
      all:
        - metric: momentum_60s
          operator: ">="
          value: 0.03
        - metric: momentum_120s
          operator: ">="
          value: 0.03
        - metric: up_price
          operator: "<="
          value: 0.85
      action: buy_up
      token_amount: 25

    - name: slow_momentum_buy_down
      all:
        - metric: momentum_60s
          operator: "<="
          value: -0.03
        - metric: momentum_120s
          operator: "<="
          value: -0.03
        - metric: down_price
          operator: "<="
          value: 0.85
      action: buy_down
      token_amount: 25
