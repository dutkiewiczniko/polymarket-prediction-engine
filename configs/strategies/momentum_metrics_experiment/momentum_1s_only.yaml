name: momentum_1s_only
type: rule_based
starting_balance: 100
order_usd: 1

# Isolate momentum_1s alone. Real calibration: momentum_1s is exactly 0.0 for 56%
# of ticks (BTC often just doesn't update within a given 1s window), so instead of
# fast_confirm's 0.003 threshold (~p95+, would barely ever fire alone) this uses a
# near-zero epsilon -- "react to any nonzero immediate BTC tick in either direction."
# This is the purest version of the "1s reacts fastest and catches big wins" theory.

params:
  default_usd_amount: 1
  max_orders: 65
  cooldown_ticks: 3

  rules:
    - name: take_profit_up_position
      all:
        - metric: has_up_position
          operator: "is"
          value: true
        - metric: up_price
          operator: ">="
          value: 0.95
      action: sell_up

    - name: take_profit_down_position
      all:
        - metric: has_down_position
          operator: "is"
          value: true
        - metric: down_price
          operator: ">="
          value: 0.95
      action: sell_down

    - name: cheap_up_lottery
      all:
        - metric: up_price
          operator: "<="
          value: 0.025
      action: buy_up
      token_amount: 25

    - name: cheap_down_lottery
      all:
        - metric: down_price
          operator: "<="
          value: 0.025
      action: buy_down
      token_amount: 25

    - name: momentum_1s_buy_up
      all:
        - metric: momentum_1s
          operator: ">="
          value: 0.0001
        - metric: up_price
          operator: "<="
          value: 0.85
      action: buy_up
      token_amount: 25

    - name: momentum_1s_buy_down
      all:
        - metric: momentum_1s
          operator: "<="
          value: -0.0001
        - metric: down_price
          operator: "<="
          value: 0.85
      action: buy_down
      token_amount: 25
