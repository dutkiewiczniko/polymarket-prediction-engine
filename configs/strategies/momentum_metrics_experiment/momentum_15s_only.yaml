name: momentum_15s_only
type: rule_based
starting_balance: 100
order_usd: 1

# Isolate momentum_15s alone (same 0.01 threshold as the 15s leg of
# momentum_fast_confirm, for direct comparability). Tests whether 15s carries
# the signal on its own, without the 1s co-requirement.

params:
  default_usd_amount: 1
  max_orders: 65
  cooldown_ticks: 3

  rules:
    - name: take_profit_up_position
      all:
        - metric: has_up_position
          operator: "is"
          value: true
        - metric: up_price
          operator: ">="
          value: 0.95
      action: sell_up

    - name: take_profit_down_position
      all:
        - metric: has_down_position
          operator: "is"
          value: true
        - metric: down_price
          operator: ">="
          value: 0.95
      action: sell_down

    - name: cheap_up_lottery
      all:
        - metric: up_price
          operator: "<="
          value: 0.025
      action: buy_up
      token_amount: 25

    - name: cheap_down_lottery
      all:
        - metric: down_price
          operator: "<="
          value: 0.025
      action: buy_down
      token_amount: 25

    - name: momentum_15s_buy_up
      all:
        - metric: momentum_15s
          operator: ">="
          value: 0.01
        - metric: up_price
          operator: "<="
          value: 0.85
      action: buy_up
      token_amount: 25

    - name: momentum_15s_buy_down
      all:
        - metric: momentum_15s
          operator: "<="
          value: -0.01
        - metric: down_price
          operator: "<="
          value: 0.85
      action: buy_down
      token_amount: 25
