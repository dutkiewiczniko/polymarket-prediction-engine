name: momentum_combo_slow_plus_1t_perrule
type: rule_based
starting_balance: 100
order_usd: 1

# Auto-generated by scripts/simulation/generate_momentum_combo_configs.py
# Windows (slowest-to-fastest): 900s, 240s, 120s, 60s, 1t
# Each window has its own pct pool (16.7% of effective balance each,
# lottery included), so no rule can starve another's budget.

params:
  default_usd_amount: 1
  max_orders: 200
  cooldown_ticks: 3
  cooldown_scope: per_rule

  pools:
    lottery:
      max_pool_spend_pct: 0.166667
    momentum_900s:
      max_pool_spend_pct: 0.166667
    momentum_240s:
      max_pool_spend_pct: 0.166667
    momentum_120s:
      max_pool_spend_pct: 0.166667
    momentum_60s:
      max_pool_spend_pct: 0.166667
    momentum_1t:
      max_pool_spend_pct: 0.166667

  rules:
    - name: take_profit_up_position
      all:
        - metric: has_up_position
          operator: "is"
          value: true
        - metric: up_price
          operator: ">="
          value: 0.95
      action: sell_up

    - name: take_profit_down_position
      all:
        - metric: has_down_position
          operator: "is"
          value: true
        - metric: down_price
          operator: ">="
          value: 0.95
      action: sell_down

    - name: cheap_up_lottery
      pool: lottery
      all:
        - metric: up_price
          operator: "<="
          value: 0.025
      action: buy_up
      token_amount: 25

    - name: cheap_down_lottery
      pool: lottery
      all:
        - metric: down_price
          operator: "<="
          value: 0.025
      action: buy_down
      token_amount: 25

    - name: momentum_900s_buy_up
      pool: momentum_900s
      all:
        - metric: momentum_900s
          operator: ">="
          value: 0.08
        - metric: up_price
          operator: "<="
          value: 0.85
      action: buy_up
      token_amount: 10

    - name: momentum_900s_buy_down
      pool: momentum_900s
      all:
        - metric: momentum_900s
          operator: "<="
          value: -0.08
        - metric: down_price
          operator: "<="
          value: 0.85
      action: buy_down
      token_amount: 10

    - name: momentum_240s_buy_up
      pool: momentum_240s
      all:
