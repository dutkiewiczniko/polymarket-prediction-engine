name: momentum_combo_no_ticks
type: rule_based
starting_balance: 100
order_usd: 1

# Auto-generated by scripts/simulation/generate_momentum_combo_configs.py
# Windows (slowest-to-fastest): 120s, 60s, 30s, 15s, 3s, 2s, 1s
# Each window has its own pct pool (12.5% of effective balance each,
# lottery included), so no rule can starve another's budget.

params:
  default_usd_amount: 1
  max_orders: 200
  cooldown_ticks: 3

  pools:
    lottery:
      max_pool_spend_pct: 0.125
    momentum_120s:
      max_pool_spend_pct: 0.125
    momentum_60s:
      max_pool_spend_pct: 0.125
    momentum_30s:
      max_pool_spend_pct: 0.125
    momentum_15s:
      max_pool_spend_pct: 0.125
    momentum_3s:
      max_pool_spend_pct: 0.125
    momentum_2s:
      max_pool_spend_pct: 0.125
    momentum_1s:
      max_pool_spend_pct: 0.125

  rules:
    - name: take_profit_up_position
      all:
        - metric: has_up_position
          operator: "is"
          value: true
        - metric: up_price
          operator: ">="
          value: 0.95
      action: sell_up

    - name: take_profit_down_position
      all:
        - metric: has_down_position
          operator: "is"
          value: true
        - metric: down_price
          operator: ">="
          value: 0.95
      action: sell_down

    - name: cheap_up_lottery
      pool: lottery
      all:
        - metric: up_price
          operator: "<="
          value: 0.025
      action: buy_up
      token_amount: 25

    - name: cheap_down_lottery
      pool: lottery
      all:
        - metric: down_price
          operator: "<="
          value: 0.025
      action: buy_down
      token_amount: 25

    - name: momentum_120s_buy_up
      pool: momentum_120s
      all:
        - metric: momentum_120s
          operator: ">="
          value: 0.03
        - metric: up_price
          operator: "<="
          value: 0.85
      action: buy_up
      token_amount: 10

    - name: momentum_120s_buy_down
      pool: momentum_120s
      all:
        - metric: momentum_120s
          operator: "<="
          value: -0.03
        - metric: down_price
          operator: "<="
          value: 0.85
      action: buy_down
      token_amount: 10

    - name: momentum_60s_buy_up
