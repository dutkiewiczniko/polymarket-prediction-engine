name: momentum_combo_sub_2t_1s_60s_120s
type: rule_based
starting_balance: 100
order_usd: 1

# Auto-generated by scripts/simulation/generate_momentum_combo_configs.py
# Windows (slowest-to-fastest): 120s, 60s, 1s, 2t
# Each window has its own pct pool (20.0% of effective balance each,
# lottery included), so no rule can starve another's budget.

params:
  default_usd_amount: 1
  max_orders: 200
  cooldown_ticks: 3

  pools:
    lottery:
      max_pool_spend_pct: 0.2
    momentum_120s:
      max_pool_spend_pct: 0.2
    momentum_60s:
      max_pool_spend_pct: 0.2
    momentum_1s:
      max_pool_spend_pct: 0.2
    momentum_2t:
      max_pool_spend_pct: 0.2

  rules:
    - name: take_profit_up_position
      all:
        - metric: has_up_position
          operator: "is"
          value: true
        - metric: up_price
          operator: ">="
          value: 0.95
      action: sell_up

    - name: take_profit_down_position
      all:
        - metric: has_down_position
          operator: "is"
          value: true
        - metric: down_price
          operator: ">="
          value: 0.95
      action: sell_down

    - name: cheap_up_lottery
      pool: lottery
      all:
        - metric: up_price
          operator: "<="
          value: 0.025
      action: buy_up
      token_amount: 25

    - name: cheap_down_lottery
      pool: lottery
      all:
        - metric: down_price
          operator: "<="
          value: 0.025
      action: buy_down
      token_amount: 25

    - name: momentum_120s_buy_up
      pool: momentum_120s
      all:
        - metric: momentum_120s
          operator: ">="
          value: 0.03
        - metric: up_price
          operator: "<="
          value: 0.85
      action: buy_up
      token_amount: 10

    - name: momentum_120s_buy_down
      pool: momentum_120s
      all:
        - metric: momentum_120s
          operator: "<="
          value: -0.03
        - metric: down_price
          operator: "<="
          value: 0.85
      action: buy_down
      token_amount: 10

    - name: momentum_60s_buy_up
      pool: momentum_60s
      all:
        - metric: momentum_60s
          operator: ">="
          value: 0.03
        - metric: up_price
          operator: "<="
          value: 0.85
      action: buy_up
      token_amount: 10

    - name: momentum_60s_buy_down
      pool: momentum_60s
      all:
        - metric: momentum_60s
          operator: "<="
          value: -0.03
        - metric: down_price
          operator: "<="
          value: 0.85
      action: buy_down
      token_amount: 10

    - name: momentum_1s_buy_up
      pool: momentum_1s
      all:
        - metric: momentum_1s
          operator: ">="
          value: 0.0001
        - metric: up_price
          operator: "<="
          value: 0.85
      action: buy_up
      token_amount: 10

    - name: momentum_1s_buy_down
      pool: momentum_1s
      all:
        - metric: momentum_1s
          operator: "<="
          value: -0.0001
        - metric: down_price
          operator: "<="
          value: 0.85
      action: buy_down
      token_amount: 10

    - name: momentum_2t_buy_up
