name: momentum_combo_ticks4
type: rule_based
starting_balance: 100
order_usd: 1

# Auto-generated by scripts/simulation/generate_momentum_combo_configs.py
# Windows (slowest-to-fastest): 4t, 3t, 2t, 1t
# Each window has its own pct pool (20.0% of effective balance each,
# lottery included), so no rule can starve another's budget.

params:
  default_usd_amount: 1
  max_orders: 200
  cooldown_ticks: 3

  pools:
    lottery:
      max_pool_spend_pct: 0.2
    momentum_4t:
      max_pool_spend_pct: 0.2
    momentum_3t:
      max_pool_spend_pct: 0.2
    momentum_2t:
      max_pool_spend_pct: 0.2
    momentum_1t:
      max_pool_spend_pct: 0.2

  rules:
    - name: take_profit_up_position
      all:
        - metric: has_up_position
          operator: "is"
          value: true
        - metric: up_price
          operator: ">="
          value: 0.95
      action: sell_up

    - name: take_profit_down_position
      all:
        - metric: has_down_position
          operator: "is"
          value: true
        - metric: down_price
          operator: ">="
          value: 0.95
      action: sell_down

    - name: cheap_up_lottery
      pool: lottery
      all:
        - metric: up_price
          operator: "<="
          value: 0.025
      action: buy_up
      token_amount: 25

    - name: cheap_down_lottery
      pool: lottery
      all:
        - metric: down_price
          operator: "<="
          value: 0.025
      action: buy_down
      token_amount: 25

    - name: momentum_4t_buy_up
      pool: momentum_4t
      all:
        - metric: momentum_4t
          operator: ">="
          value: 0.0001
        - metric: up_price
          operator: "<="
          value: 0.85
      action: buy_up
      token_amount: 10

    - name: momentum_4t_buy_down
      pool: momentum_4t
      all:
        - metric: momentum_4t
          operator: "<="
          value: -0.0001
        - metric: down_price
          operator: "<="
          value: 0.85
      action: buy_down
      token_amount: 10

    - name: momentum_3t_buy_up
      pool: momentum_3t
      all:
        - metric: momentum_3t
          operator: ">="
          value: 0.0001
        - metric: up_price
          operator: "<="
          value: 0.85
      action: buy_up
      token_amount: 10

    - name: momentum_3t_buy_down
      pool: momentum_3t
      all:
        - metric: momentum_3t
          operator: "<="
          value: -0.0001
        - metric: down_price
          operator: "<="
          value: 0.85
      action: buy_down
      token_amount: 10

    - name: momentum_2t_buy_up
      pool: momentum_2t
      all:
        - metric: momentum_2t
          operator: ">="
          value: 0.0001
        - metric: up_price
          operator: "<="
          value: 0.85
      action: buy_up
      token_amount: 10

    - name: momentum_2t_buy_down
      pool: momentum_2t
      all:
        - metric: momentum_2t
          operator: "<="
          value: -0.0001
        - metric: down_price
          operator: "<="
          value: 0.85
      action: buy_down
      token_amount: 10

    - name: momentum_1t_buy_up
      pool: momentum_1t
