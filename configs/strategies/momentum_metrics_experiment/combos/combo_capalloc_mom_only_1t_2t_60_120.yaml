name: momentum_capalloc_mom_only_1t_2t_60_120
type: rule_based
starting_balance: 100
order_usd: 1

# Auto-generated by scripts/simulation/generate_capital_allocation_configs.py
# Winner window set ['1t', '60s', '120s', '240s', '900s'], capital-allocation variant 'mom_only_1t_2t_60_120'.
