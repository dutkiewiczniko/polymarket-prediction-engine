          operator: "<="
          value: 0.85
      action: buy_up
      token_amount: 10

    - name: momentum_120s_buy_down
      pool: momentum_120s
      all:
        - metric: momentum_120s
          operator: "<="
          value: -0.03
        - metric: down_price
          operator: "<="
          value: 0.85
      action: buy_down
      token_amount: 10

