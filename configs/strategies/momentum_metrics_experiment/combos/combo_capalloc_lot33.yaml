name: momentum_capalloc_lot33
type: rule_based
starting_balance: 100
order_usd: 1

# Auto-generated by scripts/simulation/generate_capital_allocation_configs.py
# Winner window set ['1t', '60s', '120s', '240s', '900s'], capital-allocation variant 'lot33'.
# Pool shares (max_pool_spend_pct of effective balance): lottery=0.33, momentum_1t=0.134, momentum_60s=0.134, momentum_120s=0.134, momentum_240s=0.134, momentum_900s=0.134
# cooldown_scope: global

params:
  default_usd_amount: 1
  max_orders: 200
  cooldown_ticks: 3

  pools:
    lottery:
      max_pool_spend_pct: 0.33
    momentum_900s:
      max_pool_spend_pct: 0.134
    momentum_240s:
      max_pool_spend_pct: 0.134
    momentum_120s:
      max_pool_spend_pct: 0.134
    momentum_60s:
      max_pool_spend_pct: 0.134
    momentum_1t:
      max_pool_spend_pct: 0.134

  rules:
    - name: take_profit_up_position
      all:
        - metric: has_up_position
          operator: "is"
          value: true
        - metric: up_price
          operator: ">="
          value: 0.95
      action: sell_up

    - name: take_profit_down_position
      all:
        - metric: has_down_position
          operator: "is"
          value: true
        - metric: down_price
          operator: ">="
          value: 0.95
      action: sell_down


    - name: cheap_up_lottery
      pool: lottery
      all:
        - metric: up_price
          operator: "<="
          value: 0.025
      action: buy_up
      token_amount: 25

    - name: cheap_down_lottery
      pool: lottery
      all:
        - metric: down_price
          operator: "<="
          value: 0.025
      action: buy_down
      token_amount: 25

    - name: momentum_900s_buy_up
      pool: momentum_900s
      all:
        - metric: momentum_900s
          operator: ">="
          value: 0.08
        - metric: up_price
          operator: "<="
          value: 0.85
      action: buy_up
      token_amount: 10

    - name: momentum_900s_buy_down
      pool: momentum_900s
      all:
        - metric: momentum_900s
          operator: "<="
          value: -0.08
        - metric: down_price
          operator: "<="
          value: 0.85
      action: buy_down
