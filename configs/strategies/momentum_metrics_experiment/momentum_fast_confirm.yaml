name: momentum_fast_confirm
type: rule_based
starting_balance: 100
order_usd: 1

# Hypothesis: very short-window momentum (1s + 15s agreeing) reacts fastest to a
# move, catching it early. Thresholds calibrated from real data: momentum_1s is
# ~0 most of the time (median 0.0000%, p90 0.0013%) and momentum_15s has p75
# ~0.0118% -- these are the finest-grained signals the engine can produce.

params:
  default_usd_amount: 1
  max_orders: 65
  cooldown_ticks: 3

  rules:
    - name: take_profit_up_position
      all:
        - metric: has_up_position
          operator: "is"
          value: true
        - metric: up_price
          operator: ">="
          value: 0.95
      action: sell_up

    - name: take_profit_down_position
      all:
        - metric: has_down_position
          operator: "is"
          value: true
        - metric: down_price
          operator: ">="
          value: 0.95
      action: sell_down

    - name: cheap_up_lottery
      all:
        - metric: up_price
          operator: "<="
          value: 0.025
      action: buy_up
      token_amount: 25

    - name: cheap_down_lottery
      all:
        - metric: down_price
          operator: "<="
          value: 0.025
      action: buy_down
      token_amount: 25

    - name: fast_momentum_buy_up
      all:
        - metric: momentum_1s
          operator: ">="
          value: 0.003
        - metric: momentum_15s
          operator: ">="
          value: 0.01
        - metric: up_price
          operator: "<="
          value: 0.85
      action: buy_up
      token_amount: 25

    - name: fast_momentum_buy_down
      all:
        - metric: momentum_1s
          operator: "<="
          value: -0.003
        - metric: momentum_15s
          operator: "<="
          value: -0.01
        - metric: down_price
          operator: "<="
          value: 0.85
      action: buy_down
      token_amount: 25
