name: opp_preserve_neutral_layered_breakout_lottery
type: rule_based
starting_balance: 100
order_usd: 1

params:
  default_usd_amount: 1
  max_orders: 95
  max_market_spend_usd: 30
  cooldown_ticks: 3
  sell_opposite_first: false

  rules:
    - name: take_profit_up_position
      all:
        - metric: has_up_position
          operator: "is"
          value: true
        - metric: up_price
          operator: ">="
          value: 0.95
      action: sell_up

    - name: take_profit_down_position
      all:
        - metric: has_down_position
          operator: "is"
          value: true
        - metric: down_price
          operator: ">="
          value: 0.95
      action: sell_down

    - name: cheap_up_tail
      all:
        - metric: up_price
          operator: "<="
          value: 0.025
      action: buy_up
      token_amount: 25

    - name: cheap_down_tail
      all:
        - metric: down_price
          operator: "<="
          value: 0.025
      action: buy_down
      token_amount: 25

    - name: btc_above_ptb_chase_up
      all:
        - metric: btc_above_price_to_beat
          operator: "is"
          value: true
        - metric: up_price
          operator: "<="
          value: 0.82
      action: buy_up
      token_amount: 20

    - name: btc_below_ptb_chase_down
      all:
        - metric: btc_below_price_to_beat
          operator: "is"
          value: true
        - metric: down_price
          operator: "<="
          value: 0.82
      action: buy_down
      token_amount: 20

    - name: up_breakout_chase
      all:
        - metric: up_price_pct_change
          operator: ">="
          value: 3
        - metric: up_price
          operator: "<="
          value: 0.85
      action: buy_up
      token_amount: 18

    - name: down_breakout_chase
      all:
        - metric: down_price_pct_change
          operator: ">="
          value: 3
        - metric: down_price
          operator: "<="
          value: 0.85
      action: buy_down
      token_amount: 18

    - name: fade_up_late_spike
      all:
        - metric: seconds_left
          operator: "<="
          value: 90
        - metric: up_price_pct_change
          operator: ">="
          value: 6
        - metric: up_price
          operator: ">="
          value: 0.65
      action: buy_down
      token_amount: 12
      cooldown_ticks: 7

    - name: fade_down_late_spike
      all:
        - metric: seconds_left
          operator: "<="
          value: 90
        - metric: down_price_pct_change
          operator: ">="
          value: 6
        - metric: down_price
          operator: ">="
          value: 0.65
      action: buy_up
      token_amount: 12
      cooldown_ticks: 7

